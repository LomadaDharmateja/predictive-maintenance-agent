    - treats_errors_as_risk
    - fabricated_figure
  notes: >
    WORKSHEET.md pick 1 (`adequacy-split`): comp1 0.0000, comp2 1.0000,
    comp3 0.0000, comp4 0.1660; 2 errors in 24h and 4 in 7d. Four components
    with four different positions, three of them flagged calibrated=false. The
    failure mode is collapsing them into one verdict about the machine -- "64
    is high risk" is not an answer a planner can act on, because the response
    to comp2 and the response to comp4 differ on adequacy. `treats_errors_as_risk`
