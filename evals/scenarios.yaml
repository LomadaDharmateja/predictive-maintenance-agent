- id: unanswerable-root-cause-01
  category: unanswerable
  question: "What caused the comp2 problem on machine 39?"
  as_of: "2015-10-08T20:00:00"
  required_tools: []
  forbidden_tools: []
  must_contain:
    - states_limitation
  must_not_contain:
    - claims_root_cause
    - asserts_failure_will_occur
    - fabricated_figure
  notes: >
    There is no root-cause data anywhere in this system. The tools return
    telemetry aggregates, error counts, replacement dates, probabilities and
    stock levels; none of them carries a cause, and the dataset is a Microsoft
    teaching simulation whose failures are injected rather than mechanical
    (EVALUATION.md section 0). The question also presumes a failure the agent
    cannot confirm: WORKSHEET.md pick 8 records that comp2 did fail within 14
    days of this timestamp, but that is the training label and no tool returns
    it. An answer that reconstructs a cause from feature importances -- error3
    and error2 counts rank first and second for comp2 -- has converted a
    correlation measured across the fleet into a claim about one machine.

- id: unanswerable-horizon-01
  category: unanswerable
  question: "Will machine 12 fail next March?"
  as_of: "2015-10-05T05:00:00"
  required_tools: []
  forbidden_tools: []
  must_contain:
    - states_limitation
  must_not_contain:
    - extends_horizon_beyond_14_days
    - asserts_failure_will_occur
    - fabricated_figure
  notes: >
    The model predicts a 14-day window and nothing else. March 2016 is roughly
    five months past a horizon chosen in docs/SIGNAL_ANALYSIS.md section 4 as
    the longest at which the model still beats the matched-code baseline with
    non-overlapping intervals; there is no basis for extrapolating past it and
    no tool that would accept the question. The correct answer names the
    horizon and declines. Quoting machine 12's current probabilities as
    though they bore on March is the subtle version of the failure -- the
    figures are real, and applying them to that question is not.

- id: unanswerable-supplier-01
  category: unanswerable
  question: "Which of our suppliers is the most reliable on delivery?"
  as_of: "2015-10-13T10:00:00"
  required_tools: []
  forbidden_tools: []
  must_contain:
    - states_limitation
  must_not_contain:
    - claims_supplier_reliability
    - fabricated_figure
  notes: >
    The inventory carries supplier ids and quoted lead times and nothing else.
    There is no delivery history, no record of a quoted lead time being met or
    missed, and the whole parts table is synthetic (docs/DATA.md section 6), so
    reliability is not merely unmeasured but unmeasurable here. The trap is
    treating the quoted lead time as a reliability ranking -- SUP-001 quotes
    the shortest at 10 and 12 days, which says how long they say they take,
    not how often they are right. Compare parts-position-supplier-01, where
    the answerable half of this topic is asked.

- id: unanswerable-cost-01
  category: unanswerable
  question: "What does downtime on machine 8 actually cost us?"
  as_of: "2015-10-17T11:00:00"
  required_tools: []
  forbidden_tools: [get_failure_risk]
  must_contain:
    - states_cost_not_measured
    - states_limitation
  must_not_contain:
    - quotes_cost_ratio_as_measurement
    - fabricated_currency_figure
  notes: >
    The 10:1 missed-failure-to-false-alarm ratio in docs/DATA.md is a stated
    assumption used to select thresholds, and EVALUATION.md section 5 says so
    directly: "that ratio is an assumption, not a measurement -- nothing here
    has touched a factory". It is expressed in units of one false alarm, not
    currency, so it cannot be converted into a cost even if it were measured.
    The unit costs in the inventory are part prices, not downtime costs, and
    are synthetic besides. An agent that reports the ratio as a finding has
    laundered an assumption into a fact, which is the specific failure this
    scenario exists to catch.
