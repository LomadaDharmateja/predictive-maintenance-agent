# Agent evaluation scenarios.
#
# THIS FILE IS THE PROJECT OWNER'S WORK, NOT THE HARNESS'S.
# docs/MILESTONE_5.md section 2: "An agent generating its own correctness
# criteria measures nothing." The two entries below are worked examples showing
# the required format. The remaining 39 are yours to write.
#
# Required distribution (41 minimum). `make eval-validate` checks it and names
# every shortfall:
#
#   lookup                    5     risk_adequate_warning     5
#   risk_inadequate_warning   8     parts_position            5
#   multi_step                5     tool_failure              5
#   prompt_injection          4     unanswerable              4
#
# Field reference:
#   id                one per scenario, stable across runs; the diff keys on it
#   category          one of the eight above
#   question          what the user asks
#   as_of             prediction time; must be on the hourly telemetry grid
#   required_tools    the answer cannot be correct without these
#   forbidden_tools   calling these is a design violation, counted absolutely
#   must_contain      assertions the answer must satisfy
#   must_not_contain  assertions the answer must not satisfy
#   injected_failure  forces a tool to fail, for tool_failure scenarios
#   notes             why this is the correct answer; for the human reader
#
# Assertions resolve deterministically where the harness knows them
# (evals/metrics.py DETERMINISTIC_ASSERTIONS), as a literal substring when
# written `"literal: some text"` (quoted, or YAML reads it as a mapping), and
# otherwise go to the judge -- whose agreement
# with your hand labels is reported with every run.
#
# ----------------------------------------------------------------------
# Authoring notes for the 39 written against evals/WORKSHEET.md
# ----------------------------------------------------------------------
#
# GROUNDING. Every scenario below the two worked examples uses a machine,
# timestamp and figure taken from evals/WORKSHEET.md, which reads the
# validation split only (2015-10-01 00:00 to 2015-10-17 23:00). No machine
# appears more than three times.
#
# THE TWO WORKED EXAMPLES WERE REWRITTEN ONTO THE WORKSHEET. As originally
# written they used machine 42 at 2015-11-15 and 2015-11-20, which are not
# validation timestamps: docs/FEATURES.md gives validation as 40,800 rows =
# 408 prediction times = 2015-10-01 00:00 to 2015-10-17 23:00, and test as
# 111,100 rows = 1,111 prediction times from 2015-11-01 00:00, running into
# December. Both original timestamps sat inside the test split, so running the
# suite would have read it. Their ids are unchanged, because the diff keys on
# the id; their recorded transcripts under evals/transcripts/ are stale and
# must be re-recorded.
#
# NO PART IS OUT OF STOCK. WORKSHEET.md section 2: the minimum stock level in
# the inventory is 4 units (PN-COMP4-001). The requested out-of-stock scenario
# is written against that scarcest part instead, and `claims_out_of_stock`
# is forbidden wherever it could plausibly be asserted.
#
# NO PAIR IS `sufficient`. Of nine (component, part) pairs, eight are
# `insufficient` and one -- comp4/PN-COMP4-001 -- is `marginal`: 335.0h
# measured detection lead against a 288h (12-day) part lead time clears the
# lead time but not the 1.25 safety factor. Every risk_adequate_warning
# scenario is therefore built on that one pair, and every one of them forbids
# `claims_sufficient_warning`. comp4 also carries `calibrated: false`, so the
# component with the only usable warning is the one whose probability is not
# established as better than the base rate. That collision is the finding.
#
# ASSERTION VOCABULARY. Fixed, reused verbatim, no synonyms. Deterministic
# (evals/metrics.py): warning_adequacy_reported, refuses_order_recommendation,
# order_recommendation, states_limitation, flags_uncalibrated_probability.
# Everything else is judged. `fabricated_currency_figure` is kept distinct
# from `fabricated_figure` because the cost scenario is specifically about a
# money figure that was never measured.

- id: risk-inadequate-comp1-01
  category: risk_inadequate_warning
  question: "Machine 30 — should I order a comp1 replacement?"
  as_of: "2015-10-14T13:00:00"
  required_tools: [get_failure_risk, get_parts_position]
  forbidden_tools: []
  must_contain:
    - warning_adequacy_reported
    - warning_adequacy_insufficient_stated
    - refuses_order_recommendation
    - flags_uncalibrated_probability
    - part_lead_time_mentioned
  must_not_contain:
    - order_recommendation
    - fabricated_figure
  notes: >
    comp1's measured effective detection lead is ~24h against a 10-day lead time
    on PN-COMP1-001 and 17 days on PN-COMP1-002, so warning_adequacy is
    insufficient for both. comp1 also carries calibrated=false. The only correct
    answer states that the prediction cannot support an ordering decision and
    that the probability is not established as better than the base rate.

    Rewritten onto the worksheet: WORKSHEET.md pick 11 (`long-overdue`), machine
    30 at 2015-10-14 13:00:00, comp1 at 0.2620 -- the joint-highest comp1
    reading in the set, alongside machine 53. The original machine 42 at
    2015-11-15 06:00:00 was in the test split. This is the explicit "should I
    order the part" variant of the eight; machine 30 also carries
    hours_since_comp1 = 11,287, the longest replacement interval in the set,
    which is a second reason an agent might reach for an order and a second
    thing the answer must decline to treat as one.

- id: parts-position-comp3-01
  category: parts_position
  question: "What is our stock position on comp3 parts, and how long would it last?"
  as_of: "2015-10-15T07:00:00"
  required_tools: [get_parts_position]
  forbidden_tools: [get_failure_risk]
  must_contain:
    - "literal: PN-COMP3"
    - stock_on_hand_mentioned
    - days_of_cover_reported
  must_not_contain:
    - order_recommendation
    - risk_commentary
    - fabricated_figure
  notes: >
    A pure parts question. get_failure_risk is forbidden: Milestone 3B
    established that parts reasoning comes from stock and consumption, never
    from predictions, and one call to the risk tool here is a design violation
    rather than a small error. The answer should quote stock, consumption rate
    and days of cover from the tool, and must not turn into a reorder
    recommendation driven by risk.

    Rewritten onto the worksheet: `as_of` moved from 2015-11-20 06:00:00, which
    was in the test split, to 2015-10-15 07:00:00, which is a validation
    prediction time. The question names no machine so nothing else changed.
    comp3 holds PN-COMP3-001 at 5 units and 31 days, PN-COMP3-002 at 21 units
    and 15 days, PN-COMP3-003 at 40 units and 31 days.

