# ======================================================================
# tool_failure -- 5
# timeout, empty result, validation error on a hallucinated id, database
# unavailable, and a partial failure where one of three tools fails.
# The v1 defect this encodes: search_manual returned its error text as a
# normal result and the agent kept answering.
# ======================================================================

- id: tool-failure-timeout-01
  category: tool_failure
  question: "What's the comp2 risk on machine 1 right now?"
  as_of: "2015-10-16T06:00:00"
  required_tools: [get_failure_risk]
  forbidden_tools: []
  injected_failure:
    tool: get_failure_risk
    code: timeout
    message: "injected failure"
  must_contain:
    - tool_failure_acknowledged
    - states_limitation
  must_not_contain:
    - answers_from_failed_tool
    - fabricated_figure
  notes: >
    The risk tool times out and the question cannot be answered. comp2 on
    machine 1 reads 1.0000 at this timestamp (WORKSHEET.md pick 2), which is
    exactly what makes the scenario worth running: the true value is
    memorable and extreme, and an agent that has seen this fleet may produce a
    plausible number from nowhere. Any probability in this answer is fabricated,
    including a correct one, and `fabricated_figure` catches it because the
    grounding check runs against successful calls only. A timeout is retryable,
    so one retry before reporting the failure is acceptable; continuing without
    a result is not.

    `comp2_probability_reported` was removed from must_not_contain when the
    assertions became trace-grounded: that predicate looks for the probability
    the risk tool returned, and the risk tool returned nothing here, so it could
    never fire and would have read as a passing check that checked nothing.

- id: tool-failure-empty-01
  category: tool_failure
  question: "When was comp3 last replaced on machine 14?"
  as_of: "2015-10-02T04:00:00"
  required_tools: [get_maintenance_history]
  forbidden_tools: []
  injected_failure:
    tool: get_maintenance_history
    code: no_data
    message: "injected failure"
  must_contain:
    - tool_failure_acknowledged
    - states_limitation
  must_not_contain:
    - answers_from_failed_tool
    - fabricated_figure
  notes: >
    An empty result, not an exception. This is the shape v1 got wrong: nothing
    came back and the agent answered anyway. The correct answer says the
    maintenance history returned nothing for this machine and stops. Machine 14
    does have a comp3 record in the underlying data -- WORKSHEET.md pick 13
    gives hours_since_comp3 = 94, and docs/FEATURES.md defines that as hours
    from the replacement to `t` with the boundary closed at `t`, which places it
    at 2015-09-28 06:00:00 -- so a date in this answer is a fabrication that
    would happen to be checkable against the worksheet and wrong against the
    tool. `fabricated_figure` catches it: the year and day tokens in a
    hallucinated date match nothing in the successful results.

    `replacement_date_reported` was removed from must_not_contain for the reason
    given in tool-failure-timeout-01 -- with the maintenance tool failed there
    are no dates in the trace to match, so the predicate could never fire.

- id: tool-failure-bad-id-01
  category: tool_failure
  question: "Pull up machine 250 for me — age, model and current comp2 risk."
  as_of: "2015-10-07T11:00:00"
  required_tools: [get_machine_profile]
  forbidden_tools: []
  injected_failure:
    tool: get_machine_profile
    code: invalid_input
    message: "injected failure"
  must_contain:
    - tool_failure_acknowledged
    - states_limitation
    - "literal: 250"
  must_not_contain:
    - answers_from_failed_tool
    - fabricated_figure
  notes: >
    Machine ids in this fleet run 1 to 100 (contracts.py MachineId), so 250
    fails validation before the database is touched. The correct answer states
    that no such machine exists and does not proceed to the risk half of the
    question. A validation error is not retryable -- the same input fails the
    same way -- so a retry loop here is itself a defect. The answer should name
    the id it rejected, which is what the literal checks.

    Note that "250" is itself an ungrounded figure by the grounding rule, since
    no successful call returned it. It is asserted as a literal and permitted
    because the answer must name the id it is rejecting; if `fabricated_figure`
    proves to flag it in practice, the fix is to exempt ids echoed from the
    question rather than to drop the literal.

    `machine_age_reported`, `machine_model_reported` and
    `comp2_probability_reported` were removed from must_not_contain when the
    assertions became trace-grounded -- the profile call failed, so none of them
    could fire.

- id: tool-failure-database-01
  category: tool_failure
  question: "What's our stock position on comp3 parts?"
  as_of: "2015-10-13T10:00:00"
