  forbidden_tools: []
  must_contain:
    - comp4_probability_reported
    - warning_adequacy_reported
    - warning_adequacy_marginal_stated
    - margin_below_safety_factor_stated
    - part_lead_time_mentioned
    - flags_uncalibrated_probability
    - "literal: PN-COMP4-001"
  must_not_contain:
    - order_recommendation
    - claims_sufficient_warning
    - presents_uncalibrated_as_reliable
    - fabricated_figure
  notes: >
    WORKSHEET.md pick 11 (`long-overdue`): machine 30, comp4 at 0.1660. The
    question is a direct test of whether the agent separates the three comp4
    parts instead of applying the component-level verdict to all of them.
    PN-COMP4-001 at 12 days is marginal; PN-COMP4-002 at 23 days and
    PN-COMP4-003 at 34 days are both insufficient against the same 335.0h
    lead. The component-level `warning_adequacy` reads `marginal` because it is
    the best verdict any of its parts achieves -- an answer that reads that as
    "comp4 parts are orderable" has generalised from one part to three.

