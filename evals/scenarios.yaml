    - "literal: PN-COMP3-001"
  must_not_contain:
    - order_recommendation
    - claims_out_of_stock
    - fabricated_figure
  notes: >
    WORKSHEET.md pick 9 (`multi-component`): comp3 at 0.2029, calibrated=false.
    PN-COMP3-001 holds 5 units at a 31-day lead time, the second-scarcest part
    in the inventory. This stands in for the requested out-of-stock scenario,
