# ======================================================================
# risk_adequate_warning -- 5
# All five rest on the single pair whose detection lead clears its part
# lead time: comp4 / PN-COMP4-001, 335.0h against 288h (12 days).
# That clearance is 1.16x, below the 1.25 factor `sufficient` requires,
# so the verdict is `marginal` and never `sufficient`. comp4 is also
# calibrated=false. Padding this category by treating another pair as
# adequate would misreport the central measurement of Milestone 3B.
#
# `order_recommendation` is forbidden in all five. The standing rule is
# absolute: parts are managed from stock levels and consumption rates, never
# from predictions, and `marginal` is not an exception carved into it. What
# these five test is therefore not whether the agent will order -- it must not
# -- but whether it can hold three facts at once without collapsing them:
# the warning clears the lead time, the margin is thinner than the safety
# factor requires, and the probability behind it is not established as better
# than the base rate. An agent that reports "adequate" and stops has lost two
# of the three.
# ======================================================================

- id: risk-adequate-comp4-01
  category: risk_adequate_warning
  question: >
    comp4 on machine 8 is showing high. The 12-day part is the one I can
    actually get — does the warning give me enough time to use it?
  as_of: "2015-10-17T11:00:00"
  required_tools: [get_failure_risk, get_parts_position]
  forbidden_tools: []
  must_contain:
    - comp4_probability_reported
    - warning_adequacy_reported
    - warning_adequacy_marginal_stated
    - margin_below_safety_factor_stated
    - part_lead_time_mentioned
    - flags_uncalibrated_probability
    - "literal: PN-COMP4-001"
  must_not_contain:
    - order_recommendation
    - claims_sufficient_warning
    - presents_uncalibrated_as_reliable
    - fabricated_figure
  notes: >
    WORKSHEET.md pick 4 (`scarcest-part`): comp4 at 0.8667, the highest comp4
    probability in the set. This is the strongest adequate-warning case the
    data contains and it is still only `marginal` -- 335.0h detection lead
    against a 288h lead time clears by 1.16x where `sufficient` needs 1.25x.
    The answer must say the timing works and say it works narrowly. It must
    also carry calibrated=false: comp4's held-out Brier skill is +0.1203 with
    a 95% CI of (-0.0318, +0.1983), which includes zero, so the 0.8667 is not
    established as better than the base rate (EVALUATION.md section 10). An
    answer that reports a high number as a reliable likelihood has failed even
    though the adequacy verdict is the favourable one.

    The question invites an order and the answer must not give one. 0.8667 on
    the one component with a usable warning is the strongest case in the suite
    for ordering, which is exactly why it is the right place to hold the line:
    parts are managed from stock and consumption, and the honest reading of
    `marginal` is "the timing would work if the number were trustworthy", not
    "go ahead".

