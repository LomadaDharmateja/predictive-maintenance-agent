# ======================================================================
# multi_step -- 5
# Fleet-level, several tools. must_contain specifies the shape of a good
# answer rather than an exact list, because several orderings are defensible.
# ======================================================================

- id: multi-step-weekly-review-01
  category: multi_step
  question: "Which machines should I be looking at this week?"
  as_of: "2015-10-16T06:00:00"
  required_tools: [find_machines, get_failure_risk]
  forbidden_tools: []
  must_contain:
    - machines_named_with_reasoning
    - warning_adequacy_reported
    - states_limitation
  must_not_contain:
    - order_recommendation
    - fabricated_figure
  notes: >
    The open fleet question. No exact list is asserted: the agent must select
    machines itself and several selections are defensible, so the shape is what
    is checked -- machines named, a reason given for each, and the limitations
    stated. Machine 1 carries comp2 at 1.0000 at this timestamp (WORKSHEET.md
    pick 2) and belongs in any defensible list, but its absence is not asserted
    as a failure because the agent's scan may legitimately surface others. The
    limitation that must appear is the 14-day horizon and the adequacy verdict:
    this is a list of machines to schedule attention on, not a list of parts to
    order.

- id: multi-step-least-prepared-01
  category: multi_step
  question: >
    Across the fleet, which component has the shortest warning relative to
    its part lead time?
  as_of: "2015-10-09T06:00:00"
  required_tools: [get_parts_position, get_failure_risk]
  forbidden_tools: []
  must_contain:
    - "literal: comp1"
    - part_lead_time_mentioned
    - warning_adequacy_reported
    - states_limitation
  must_not_contain:
    - claims_sufficient_warning
    - order_recommendation
    - fabricated_figure
  notes: >
    comp1 is the answer and the arithmetic is unambiguous: a 24.0h measured
    detection lead against part lead times of 240h and 408h, a ratio of about
    0.10. The other three sit far above it -- comp2 at 335.0/768 = 0.44, comp3
    at 326.5/744 = 0.44, comp4 at 335.0/288 = 1.16. comp1 additionally carries
    calibrated=false with a held-out skill of +0.0049 and a CI of (-0.1041,
    +0.0251), so the warning is both the shortest and the least trustworthy.

    The question was rewritten from "which component are we least prepared
    for?" to name the ratio directly. The old phrasing was genuinely ambiguous:
    read as stock, the answer is comp4 at 4 units or comp3 at 5 units on a
    31-day lead, and a defensible answer would have failed the `comp1` literal.
    The literal is kept because the rewritten question has one answer --
    WORKSHEET.md section 2 records that stock is not part of the adequacy
    arithmetic, so the ratio is a pure time comparison and comp1 wins it by a
    factor of four over the next worst.

- id: multi-step-machine-picture-01
