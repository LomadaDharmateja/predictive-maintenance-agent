name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # `pip check` after the install, because a broken dependency set is
          # not always a hard resolver failure and the symptom surfaces far
          # from the cause. requirements.txt once pinned pandas==3.0.5 against
          # mlflow's pandas<3: the install died here, pytest never ran, and
          # the only visible message was the artifact step reporting a missing
          # report.xml two steps later.
          pip install -r requirements.txt
          pip check

      # Collection is its own step so that an ImportError in a test module is
      # reported as "no module named X" here, rather than as an absent
      # report.xml at the end of the job. Nothing is executed in this step.
      - name: Collect tests (fail by name, not by missing artifact)
        run: |
          set -euo pipefail
          if ! pytest --collect-only -q > collect.log 2>&1; then
            echo "::error title=pytest collection failed::could not import the test suite"
            echo "--- collection output ---"
            cat collect.log
            grep -E "ModuleNotFoundError|ImportError|^E " collect.log | head -20 >&2 || true
            exit 1
          fi
          tail -3 collect.log

      # data/raw/ is gitignored and is not fetched here: fetching needs a Kaggle
      # credential, and this workflow deliberately has access to no secrets. The
      # tests that need the download skip themselves; everything built on
      # tests/synthetic.py still runs. The gate below is what stops that from
      # quietly becoming "nothing runs".
      - name: Run tests
        run: pytest --junitxml=report.xml

      - name: Assert the suite actually executed
        # A green pytest proves nothing on its own: with data/raw/ absent, a
        # regression in tests/conftest.py that skipped every test would exit 0.
        # This fails the build unless a real number of tests ran.
        env:
          MIN_EXECUTED: '60'
        run: |
          python - <<'PY'
          import os, pathlib, sys, xml.etree.ElementTree as ET

          minimum = int(os.environ["MIN_EXECUTED"])
          if not pathlib.Path("report.xml").exists():
              # pytest exited without writing a report at all -- a usage error
              # or a conftest that failed to import. Said plainly here, because
              # the next step's "no files were found with the provided path"
              # describes the symptom and hides the cause.
              print(
                  "FAIL: pytest produced no report.xml, so it exited before "
                  "running any test. This is a collection or configuration "
                  "failure, not a failing test -- read the 'Collect tests' "
                  "step above for the module that could not be imported.",
                  file=sys.stderr,
              )
              sys.exit(1)
          root = ET.parse("report.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")

          collected = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          failures = int(suite.get("failures", 0))
          errors = int(suite.get("errors", 0))
          executed = collected - skipped

          print(f"collected={collected} executed={executed} skipped={skipped} "
                f"failures={failures} errors={errors}")

          problems = []
          if collected == 0:
              problems.append("pytest collected no tests at all")
          if executed < minimum:
              problems.append(
                  f"only {executed} tests executed, expected at least {minimum}; "
                  "the data-independent suite is not running"
              )
          if failures or errors:
              problems.append(f"{failures} failure(s), {errors} error(s)")

          if problems:
              for problem in problems:
                  print(f"FAIL: {problem}", file=sys.stderr)
              sys.exit(1)

          print(f"OK: {executed} tests executed, at or above the floor of {minimum}")
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: report.xml
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # The image is built in CI so that .dockerignore is verified against an
  # artefact rather than trusted as a document. A correct exclusion list and a
  # COPY that predates it produce the same file and different images.
  #
  # No secret is available to this job, and none is needed: the build installs
  # from a public index and the inspection runs offline.
  # ---------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t industrial-ai-agent:ci .

      - name: Refuse an image that embeds a secret, the data or the database
        run: |
          set -euo pipefail
          found=$(docker run --rm --entrypoint sh industrial-ai-agent:ci -c '
            find / \( -name ".env" -o -name ".env.*" -o -name "*.db" \
                      -o -name "*.parquet" -o -name "kaggle.json" \
                      -o -name "id_rsa*" -o -name "*.joblib" \) \
                 -not -path "/proc/*" 2>/dev/null | head -20')
          if [ -n "$found" ]; then
            echo "FAIL: the image embeds excluded content:" >&2
            echo "$found" >&2
            exit 1
          fi
          echo "OK: no secret, data file or database in the image"

      - name: Refuse build tooling in the final image
        run: |
          set -euo pipefail
          found=$(docker run --rm --entrypoint sh industrial-ai-agent:ci -c '
            for b in gcc cc g++ make ld pip pip3 easy_install curl wget git; do
              command -v $b >/dev/null 2>&1 && echo "$b"
            done
            python -c "import pip" 2>/dev/null && echo pip-module
            python -c "import ensurepip" 2>/dev/null && echo ensurepip
            true')
          if [ -n "$found" ]; then
            echo "FAIL: build tooling present in the final image:" >&2
            echo "$found" >&2
            exit 1
          fi
          echo "OK: no compiler and no package installer in the image"

      - name: Refuse an image that runs as root
        run: |
          set -euo pipefail
          user=$(docker image inspect industrial-ai-agent:ci --format '{{.Config.User}}')
          id=$(docker run --rm --entrypoint sh industrial-ai-agent:ci -c 'id -u')
          echo "configured USER=$user runtime uid=$id"
          [ "$user" = "appuser" ] || { echo "FAIL: USER is not appuser" >&2; exit 1; }
          [ "$id" != "0" ] || { echo "FAIL: the container runs as root" >&2; exit 1; }

      - name: The service imports inside the image
        run: |
          docker run --rm --entrypoint sh industrial-ai-agent:ci -c \
            'python -c "from src.api.app import app; print(app.version)"'

  # ---------------------------------------------------------------------
  # Deterministic replay as a gate. Milestone 6 item 3: replaying a recorded
  # run must reproduce its stored answers exactly, with no model called. It
  # catches a change to the agent loop that alters behaviour without anybody
  # noticing, which no unit test would.
  #
  # It needs the database, which is built from data/raw and so is unavailable
  # here -- the job says so and skips rather than passing vacuously.
  # ---------------------------------------------------------------------
  replay:
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Replay the most recent recorded run
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, subprocess, sys

          results = pathlib.Path("evals/results")
          runs = sorted(p for p in results.glob("*.json") if "." not in p.stem)
          if not runs:
              print("SKIP: no recorded run committed; nothing to replay")
              sys.exit(0)
          if not pathlib.Path("data/pdm.db").exists():
              # Stated rather than silent. The replay needs the database, which
              # is built from a licensed download this workflow has no
              # credential for. Saying so keeps a skip from reading as a pass.
              print("SKIP: data/pdm.db absent (data/raw needs a Kaggle "
                    "credential this workflow deliberately does not have)")
              sys.exit(0)

          run_id = runs[-1].stem
          print(f"replaying {run_id}")
          sys.exit(subprocess.run(
              [sys.executable, "-m", "src.obs.replay", run_id]
          ).returncode)
          PY
