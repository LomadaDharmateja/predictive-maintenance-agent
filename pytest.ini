[pytest]
testpaths = tests
pythonpath = .
# src/eval/test_evaluation.py is named as docs/MILESTONE_3.md specifies and is
# not a test module. testpaths already scopes collection to tests/; this is the
# belt to that braces, so `pytest src` or a stray --rootdir cannot pick it up.
norecursedirs = src archive venv .git data mlruns models docs scripts
addopts = -q --strict-markers
markers =
    slow: builds the full database; several seconds per test
